<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redireccionando...</title>
    <script>
      // Redirige al index.html pasando la ruta actual como parámetro
      const path = window.location.pathname;
      // Elimina la base para obtener la ruta relativa
      const base = '/portfolio-giovanyrg/';
      const relativePath = path.startsWith(base) ? path.slice(base.length) : path;
      window.location.href = base + '?path=' + encodeURIComponent(relativePath);
    </script>
  </head>
  <body>
    <p>Redireccionando...</p>
  </body>
</html>
